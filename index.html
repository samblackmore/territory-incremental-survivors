<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Territory Incremental Survivors — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141824;
    --panel: #1e2433;
    --text: #dfe5f2;
    --muted: #8b93a7;
    --blue: #3b82f6;
    --red: #ef4444;
    --accent: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    position: fixed; inset: 0; /* the game owns the viewport; nothing scrolls */
    overscroll-behavior: none;
  }
  /* Vampire-survivors-esque XP bar across the top — above the level-up
     dim so it stays visible (and full) while cards show */
  #xpbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 15;
    height: 30px;
    background: #0b0e16;
    border-bottom: 1px solid #2a3145;
    overflow: hidden;
  }
  #xpfill {
    position: absolute; inset: 0;
    width: 0%;
    background: linear-gradient(180deg, #5aa2ff, #2f6fe4);
    transition: width 120ms linear;
  }
  #xplabel {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7);
    pointer-events: none;
  }
  #layout { display: block; padding: 0; }
  /* The canvas fills the viewport; the camera pans/zooms inside it */
  #game {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    display: block;
    background: #0b0e16;
    touch-action: none; /* 1-finger pan + 2-finger pinch, no page scroll/zoom */
  }
  #debug-toggle {
    position: fixed;
    right: 12px; bottom: 12px;
    z-index: 7;
    width: auto;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid #2a3145;
    border-radius: 999px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #fsbtn {
    position: fixed;
    right: 12px; bottom: 58px;
    z-index: 7;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid #2a3145;
    border-radius: 999px;
    color: var(--accent);
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  /* Minimap: territory coverage, top-right under the XP bar */
  #minimap-wrap {
    position: fixed;
    top: 38px; right: 12px;
    z-index: 7;
    background: rgba(10, 13, 22, 0.85);
    border: 1px solid #2a3145;
    border-radius: 8px;
    padding: 6px;
  }
  #minimap { display: block; background: #000; border-radius: 4px; touch-action: none; }
  #minimap-stats {
    display: flex; gap: 12px; margin-top: 5px;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  #minimap-stats .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 4px; vertical-align: 0px;
  }
  #minimap-stats .dot.blue { background: #3b82f6; }
  #minimap-stats .dot.red { background: #ef4444; }
  /* Finish round: appears when the enemy bloom is fully wiped out */
  #finishbtn {
    position: fixed;
    top: 44px; left: 50%; transform: translateX(-50%);
    z-index: 8;
    background: #ffd75e; color: #1a2138; border: none; border-radius: 999px;
    padding: 10px 24px; font-size: 16px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 215, 94, 0.4);
  }
  #finishbtn.hidden { display: none; }
  /* Victory banner: the full map shows behind it */
  #victory {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 8; text-align: center; padding: 24px 12px 32px;
    background: linear-gradient(180deg, transparent, rgba(5, 8, 15, 0.85));
    pointer-events: none;
  }
  #victory.hidden { display: none; }
  #victory .vtext {
    color: #ffd75e; font-size: 28px; font-weight: bold; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 12px;
    text-shadow: 0 2px 12px rgba(255, 215, 94, 0.4);
  }
  #continuebtn {
    pointer-events: auto;
    background: #ffd75e; color: #1a2138; border: none; border-radius: 8px;
    padding: 12px 32px; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  /* Debug panel floats over the game: right side on desktop, bottom sheet on phones */
  #debug {
    position: fixed;
    z-index: 6;
    top: 42px; right: 12px; bottom: 12px;
    width: 300px;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid #2a3145;
    border-radius: 8px;
    padding: 14px 14px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
  }
  #debug.collapsed { display: none; }
  @media (max-width: 720px) {
    #debug {
      top: auto; left: 12px; right: 12px; bottom: 12px;
      width: auto;
      max-height: 62vh; max-height: 62dvh;
    }
    .cardrow { flex-wrap: wrap; }
    .card { width: 130px; height: 170px; }
  }
  #debug h2 {
    margin: 0 0 10px;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  #debug h3 {
    margin: 14px 0 2px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #debug label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 2px;
  }
  #debug input {
    width: 100%;
    background: #12172a;
    border: 1px solid #2a3145;
    border-radius: 5px;
    color: var(--text);
    font-size: 13px;
    padding: 6px 8px;
  }
  #debug input:focus { outline: 1px solid var(--accent); }
  #d-restart, #d-copylink {
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    background: #2f6fe4;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  #d-restart:hover, #d-copylink:hover { background: #3b82f6; }
  #d-copylink { margin-top: 8px; background: #26314d; }
  #d-copylink:hover { background: #314063; }
  #d-stats {
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    border-top: 1px solid #2a3145;
    padding-top: 10px;
  }
  #d-stats b { color: var(--text); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  /* Level-up overlay */
  #levelup {
    position: fixed; inset: 0;
    background: rgba(5, 8, 15, 0.78);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    overflow-y: auto; /* 7 shop cards = 3 rows: scrolls on short phones instead of clipping */
  }
  #levelup.hidden { display: none; }
  /* Celebration particles pouring from the XP bar, behind the cards */
  #lvfx {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #levelup .cards { position: relative; z-index: 1; margin: auto; /* centers when it fits, scrolls from the top when it doesn't */ }
  /* Pre-game start screen */
  #startscreen {
    position: fixed; inset: 0;
    background: rgba(5, 8, 15, 0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  #startscreen.hidden { display: none; }
  .startpanel { text-align: center; max-width: 560px; padding: 20px; max-height: 92vh; overflow-y: auto; }
  .startpanel h2 {
    color: #ffd75e;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 6px;
    text-shadow: 0 2px 12px rgba(255, 215, 94, .35);
  }
  .startgold { color: var(--text); margin-bottom: 16px; font-size: 18px; }
  .startgold b { color: #ffd75e; }
  #buildver { color: #5b6478; font-size: 12px; margin-top: 14px; letter-spacing: 0.08em; }
  #teamrow { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; color: var(--text); font-size: 14px; }
  #teamrow button { padding: 6px 14px; font-size: 14px; border-radius: 8px; border: 2px solid #3a4666; background: #1a2138; color: var(--text); cursor: pointer; }
  #teamrow button.selected { border-color: #ffd75e; background: #27314d; color: #ffd75e; }
  #team-red.selected { border-color: #ef4444; color: #ef4444; }
  #team-blue.selected { border-color: #3b82f6; color: #3b82f6; }
  .startlabel { color: #5b6478; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin: 14px 0 8px; }
  #itemtoggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .itemtoggle { padding: 8px 6px; font-size: 14px; border-radius: 8px; border: 2px solid #3a4666; background: #1a2138; color: var(--text); cursor: pointer; }
  .itemtoggle.disabled { opacity: 0.45; filter: grayscale(1); }
  #permarow { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .permabtn { flex: 1; padding: 10px 8px; border-radius: 10px; border: 2px solid #3a4666; background: #1a2138; color: var(--text); cursor: pointer; text-align: center; }
  .permabtn b { display: block; font-size: 15px; margin-bottom: 2px; }
  .permasub { font-size: 11px; color: #8b93a8; margin-bottom: 6px; }
  .pip { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #3a4666; background: #1a2138; margin: 0 2px; }
  .pip.on { background: #ffd75e; border-color: #ffd75e; }
  #perma-reset { padding: 6px 14px; font-size: 13px; border-radius: 8px; border: 2px solid #3a4666; background: #1a2138; color: var(--text); cursor: pointer; margin-bottom: 14px; }
  #weaponlist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .weapon {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, #27314d, #1a2138);
    border: 2px solid #3a4666;
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    text-align: left;
  }
  .weapon.selected { border-color: #ffd75e; }
  .weapon.locked { opacity: 0.65; }
  .weapon .wicon { flex-shrink: 0; display: flex; align-items: center; }
  .weapon .wicon svg { width: 36px; height: 36px; }
  .weapon .winfo { flex: 1; min-width: 0; }
  .weapon .wname { font-weight: bold; font-size: 16px; }
  .weapon .wdesc { color: var(--muted); font-size: 13px; }
  .weapon button {
    background: var(--blue); color: #fff; border: none; border-radius: 6px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .weapon button.unlock { background: var(--blue); color: #fff; font-weight: bold; }
  .weapon button.unlock .coin {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: #f5b301; border: 1.5px solid #b8860b; margin-left: 5px; vertical-align: -1px;
  }
  .weapon button:disabled { background: #3a4666; color: #8a93a8; cursor: default; }
  #startbtn {
    background: #ffd75e; color: #1a2138; border: none; border-radius: 8px;
    padding: 12px 36px; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  #clearbtn {
    position: absolute; top: 14px; right: 16px;
    background: none; color: var(--muted); border: none; cursor: pointer;
    font-size: 13px; text-decoration: underline;
  }
  .cards { text-align: center; }
  .cards h2 {
    color: #ffd75e;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 18px;
    text-shadow: 0 2px 12px rgba(255, 215, 94, .35);
  }
  .cardrow { display: flex; gap: 12px; justify-content: center; }
  /* Compact level-up cards: 3 per row on a phone (110px cards + 12px
     gaps = 354px, fits even 360px-wide phones). Titles may wrap. */
  .card {
    width: 110px; height: 150px;
    background: linear-gradient(180deg, #27314d, #1a2138);
    border: 2px solid var(--blue);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    font-size: 12px;
    transition: transform 120ms ease, box-shadow 120ms ease;
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
  }
  .card.dealt {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 250ms ease, transform 250ms ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px rgba(59,130,246,.35); }
  .card .icon { font-size: 28px; line-height: 1; }
  .card .icon svg { width: 28px; height: 28px; }
  .card b { font-size: 15px; color: #7db4ff; text-align: center; }
  .card b .lv { color: #fff; }
  .card span { color: var(--muted); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; text-align: center; }
  .card .newtag {
    position: absolute; top: 8px; left: 8px;
    color: #ffd75e; font-size: 11px; font-weight: bold; letter-spacing: .03em;
  }
  /* Price (top-right) and unaffordable dimming apply to any card that
     costs gold — shop cards and the XP-row projectile hybrid alike. */
  .card { position: relative; }
  .card .price {
    position: absolute; top: 8px; right: 8px;
    color: #ffd75e; font-size: 13px; font-weight: bold;
  }
  .card.unaffordable.dealt { opacity: 0.45; pointer-events: none; filter: grayscale(0.6); }
  .coin {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    background: #f5b301; border: 1.5px solid #b8860b; margin-left: 4px; vertical-align: -1px;
  }
  /* Shop row: flex (not grid) so an incomplete row centers instead of
     hugging the left column. Width is exactly 3 cards + 2 gaps (354px)
     so full rows still break at 3 per row; a 1- or 2-card row centers
     inside that width (which is itself centered). Unaffordable cards
     stay visible (so you can see what to save for) but dimmed and
     untappable. Price sits top-right of each card; your gold total
     sits under the Shop title so you can compare at a glance. */
  #shoprow {
    display: flex; flex-wrap: wrap; width: 354px; margin: 0 auto;
    gap: 12px; justify-content: center;
  }
  .shoplabel {
    color: #ffd75e; font-size: 12px; letter-spacing: .15em; text-transform: uppercase;
    margin: 16px 0 10px; text-align: center;
  }
  .shoplabel .shopgold { display: block; color: #ffd75e; font-size: 15px; font-weight: bold; letter-spacing: .03em; margin-top: 4px; }
  .card.shopcard { border-color: #f5b301; }
  .card.shopcard b { color: #ffd75e; }
  /* Banners: placement prompt + wave announcements */
  .banner {
    position: fixed; top: 34px; left: 50%; transform: translateX(-50%);
    background: rgba(10, 13, 22, 0.9);
    border: 1px solid var(--blue);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 15px; color: var(--text);
    z-index: 9; pointer-events: none;
    white-space: nowrap;
  }
  .banner.hidden { display: none; }
  .banner b { color: #7db4ff; }
  #wavebanner { border-color: #ffd75e; color: #ffd75e; font-weight: bold; letter-spacing: .08em; }
  /* Run-over overlay */
  #runover {
    position: fixed; inset: 0;
    background: rgba(5, 8, 15, 0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #runover.hidden { display: none; }
  #runover h2 { color: #ef4444; }
  /* Commander intro dialog (dummy): same overlay as run-over, gold text. */
  #commander {
    position: fixed; inset: 0;
    background: rgba(5, 8, 15, 0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #commander.hidden { display: none; }
  #commander-text { color: #ffd75e; font-size: 18px; line-height: 1.6; margin: 0 0 22px; max-width: 300px; }
  #runstats { color: var(--muted); margin: 0 0 22px; line-height: 2; }
  #runstats b { color: var(--text); }
  #diveagain {
    background: linear-gradient(180deg, #27314d, #1a2138);
    border: 2px solid var(--blue);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px; font-weight: bold; letter-spacing: .05em;
    padding: 14px 40px; cursor: pointer;
  }
  #diveagain:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,.35); }
</style>
</head>
<body>

<div id="xpbar">
  <div id="xpfill"></div>
  <div id="xplabel">LV 1</div>
</div>

<div id="layout">
  <button id="debug-toggle">&lt;&gt;</button>
  <button id="fsbtn" title="Fullscreen">⛶</button>
  <div id="minimap-wrap">
    <canvas id="minimap"></canvas>
    <div id="minimap-stats">
      <div><span class="dot blue"></span><span id="minimap-blue">0%</span></div>
      <div><span class="dot red"></span><span id="minimap-red">0%</span></div>
    </div>
  </div>
  <button id="finishbtn" class="hidden">Finish Round</button>
  <div id="victory" class="hidden">
    <div class="vtext">Round complete!</div>
    <button id="continuebtn">Tap to continue</button>
  </div>
  <canvas id="game"></canvas>

  <aside id="debug" class="collapsed">
    <h2>Debug</h2>
    <label>Grid width (cells)
      <input id="d-cols" type="number" min="8" max="120" step="1" value="48">
    </label>
    <label>Grid height (cells)
      <input id="d-rows" type="number" min="8" max="120" step="1" value="36">
    </label>
    <label>Projectile speed (px/s)
      <input id="d-speed" type="number" min="40" max="2000" step="10" value="200">
    </label>
    <label>Fire frequency (shots/s)
      <input id="d-freq" type="number" min="0.1" max="20" step="0.1" value="1">
    </label>
    <label>Cannon turn arc (degrees, max 360)
      <input id="d-arc" type="number" min="0" max="360" step="5" value="120">
    </label>
    <label>Cannon turn speed (deg/s)
      <input id="d-turn" type="number" min="0" max="720" step="10" value="100">
    </label>
    <label>Cave amount (0–0.95)
      <input id="d-cave" type="number" min="0" max="0.95" step="0.05" value="0.38">
    </label>
    <label>Map seed (blank = random)
      <input id="d-seed" type="text" value="" placeholder="random">
    </label>
    <label>XP orb drop chance (0–1, per block excavated by blue)
      <input id="d-coin" type="number" min="0" max="1" step="0.05" value="0.3">
    </label>
    <h3>Hit feel</h3>
    <label>Pop hold at full size (s)
      <input id="d-pophold" type="number" min="0" max="0.5" step="0.01" value="0.03">
    </label>
    <label>Pop shrink time (s)
      <input id="d-popdur" type="number" min="0.05" max="1" step="0.01" value="0.1">
    </label>
    <label>Knockback push (cells)
      <input id="d-poppush" type="number" min="0" max="1.5" step="0.05" value="0.2">
    </label>
    <label>Neighbor ripple strength (0–1)
      <input id="d-ripple" type="number" min="0" max="1" step="0.05" value="0.1">
    </label>
    <label>Projectile trail (s)
      <input id="d-trail" type="number" min="0" max="1" step="0.01" value="0.1">
    </label>
    <label>Particle gravity (cells/s²)
      <input id="d-gravity" type="number" min="0" max="40" step="1" value="9">
    </label>
    <h3>Colors</h3>
    <label>Terrain base color (brown)
      <input id="d-terrain" type="color" value="#6b543a">
    </label>
    <label>Empty base color (green)
      <input id="d-empty" type="color" value="#4caf50">
    </label>
    <h3>Fog of war</h3>
    <label>Fog reveal distance (cells)
      <input id="d-fogdist" type="number" min="0" max="20" step="1" value="6">
    </label>
    <button id="d-restart">Restart game</button>
    <button id="d-copylink">Copy share link</button>
    <div id="d-stats"></div>
  </aside>
</div>

<div id="placebanner" class="banner hidden"></div>
<div id="wavebanner" class="banner hidden"></div>

<div id="startscreen" class="hidden">
  <div class="startpanel">
    <h2>Territory</h2>
    <!-- Shop grid lives here when dormant renderShop() is restored. -->
    <div id="weaponlist"></div>
    <div id="teamrow"><span>Team color</span><button id="team-red">Red</button><button id="team-blue">Blue</button></div>
    <div class="startlabel">Shop items for this run</div>
    <div id="itemtoggles">
      <button id="toggle-cannon" class="itemtoggle">Cannon</button>
      <button id="toggle-mole" class="itemtoggle">Digger</button>
      <button id="toggle-bloom" class="itemtoggle">Field</button>
      <button id="toggle-gather" class="itemtoggle">Harvester</button>
      <button id="toggle-lantern" class="itemtoggle">Lantern</button>
      <button id="toggle-wall" class="itemtoggle">Wall</button>
      <button id="toggle-laser" class="itemtoggle">Laser</button>
    </div>
    <div class="startlabel">Perma upgrades</div>
    <div id="permarow">
      <button id="perma-dmg" class="permabtn"></button>
      <button id="perma-rate" class="permabtn"></button>
    </div>
    <button id="perma-reset">Reset all perma upgrades</button>
    <button id="startbtn">Start Run</button>
    <div id="buildver"></div>
