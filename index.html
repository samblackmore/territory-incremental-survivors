<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Territory Incremental Survivors — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141824;
    --panel: #1e2433;
    --text: #dfe5f2;
    --muted: #8b93a7;
    --blue: #3b82f6;
    --red: #ef4444;
    --accent: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    position: fixed; inset: 0; /* the game owns the viewport; nothing scrolls */
    overscroll-behavior: none;
  }
  /* Vampire-survivors-esque XP bar across the top */
  #xpbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 5;
    height: 30px;
    background: #0b0e16;
    border-bottom: 1px solid #2a3145;
    overflow: hidden;
  }
  #xpfill {
    position: absolute; inset: 0;
    width: 0%;
    background: linear-gradient(180deg, #5aa2ff, #2f6fe4);
    transition: width 120ms linear;
  }
  #xplabel {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7);
    pointer-events: none;
  }
  #layout { display: block; padding: 0; }
  /* The canvas fills the viewport; the camera pans/zooms inside it */
  #game {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    display: block;
    background: #0b0e16;
    touch-action: none; /* 1-finger pan + 2-finger pinch, no page scroll/zoom */
  }
  #debug-toggle {
    position: fixed;
    right: 12px; bottom: 12px;
    z-index: 7;
    width: auto;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid #2a3145;
    border-radius: 999px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  /* Debug panel floats over the game: right side on desktop, bottom sheet on phones */
  #debug {
    position: fixed;
    z-index: 6;
    top: 42px; right: 12px; bottom: 12px;
    width: 300px;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid #2a3145;
    border-radius: 8px;
    padding: 14px 14px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
  }
  #debug.collapsed { display: none; }
  @media (max-width: 720px) {
    #debug {
      top: auto; left: 12px; right: 12px; bottom: 12px;
      width: auto;
      max-height: 62vh; max-height: 62dvh;
    }
    .cardrow { flex-wrap: wrap; }
    .card { width: 130px; height: 170px; }
  }
  #debug h2 {
    margin: 0 0 10px;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  #debug h3 {
    margin: 14px 0 2px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #debug label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 2px;
  }
  #debug input {
    width: 100%;
    background: #12172a;
    border: 1px solid #2a3145;
    border-radius: 5px;
    color: var(--text);
    font-size: 13px;
    padding: 6px 8px;
  }
  #debug input:focus { outline: 1px solid var(--accent); }
  #d-restart, #d-copylink {
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    background: #2f6fe4;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  #d-restart:hover, #d-copylink:hover { background: #3b82f6; }
  #d-copylink { margin-top: 8px; background: #26314d; }
  #d-copylink:hover { background: #314063; }
  #d-stats {
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    border-top: 1px solid #2a3145;
    padding-top: 10px;
  }
  #d-stats b { color: var(--text); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  /* Level-up overlay */
  #levelup {
    position: fixed; inset: 0;
    background: rgba(5, 8, 15, 0.78);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #levelup.hidden { display: none; }
  .cards { text-align: center; }
  .cards h2 {
    color: #ffd75e;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 18px;
    text-shadow: 0 2px 12px rgba(255, 215, 94, .35);
  }
  .cardrow { display: flex; gap: 16px; justify-content: center; }
  .card {
    width: 150px; height: 190px;
    background: linear-gradient(180deg, #27314d, #1a2138);
    border: 2px solid var(--blue);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    font-size: 14px;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px rgba(59,130,246,.35); }
  .card b { font-size: 30px; color: #7db4ff; }
  .card span { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
</style>
</head>
<body>

<div id="xpbar">
  <div id="xpfill"></div>
  <div id="xplabel">LV 1</div>
</div>

<div id="layout">
  <button id="debug-toggle">Toggle debug panel</button>
  <canvas id="game"></canvas>

  <aside id="debug">
    <h2>Debug</h2>
    <label>Grid width (cells)
      <input id="d-cols" type="number" min="8" max="120" step="1" value="48">
    </label>
    <label>Grid height (cells)
      <input id="d-rows" type="number" min="8" max="120" step="1" value="36">
    </label>
    <label>Projectile speed (px/s)
      <input id="d-speed" type="number" min="40" max="2000" step="10" value="260">
    </label>
    <label>Fire frequency (shots/s)
      <input id="d-freq" type="number" min="0.1" max="20" step="0.1" value="1">
    </label>
    <label>Cannon turn arc (degrees, max 360)
      <input id="d-arc" type="number" min="0" max="360" step="5" value="120">
    </label>
    <label>Cannon turn speed (deg/s)
      <input id="d-turn" type="number" min="0" max="720" step="10" value="120">
    </label>
    <label>Cave amount (0–0.95)
      <input id="d-cave" type="number" min="0" max="0.95" step="0.05" value="0.38">
    </label>
    <label>Map seed (blank = random)
      <input id="d-seed" type="text" value="" placeholder="random">
    </label>
    <label>Coin drop chance (0–1)
      <input id="d-coin" type="number" min="0" max="1" step="0.05" value="0.3">
    </label>
    <label>Level thresholds (XP per level, comma-separated)
      <input id="d-thresh" type="text" value="15,40,80,140,220,320,450,600,800,1050">
    </label>
    <h3>Hit feel</h3>
    <label>Pop hold at full size (s)
      <input id="d-pophold" type="number" min="0" max="0.5" step="0.01" value="0.03">
    </label>
    <label>Pop shrink time (s)
      <input id="d-popdur" type="number" min="0.05" max="1" step="0.01" value="0.1">
    </label>
    <label>Knockback push (cells)
      <input id="d-poppush" type="number" min="0" max="1.5" step="0.05" value="0.2">
    </label>
    <label>Neighbor ripple strength (0–1)
      <input id="d-ripple" type="number" min="0" max="1" step="0.05" value="0.1">
    </label>
    <label>Projectile trail (s)
      <input id="d-trail" type="number" min="0" max="1" step="0.01" value="0.1">
    </label>
    <label>Particle gravity (cells/s²)
      <input id="d-gravity" type="number" min="0" max="40" step="1" value="9">
    </label>
    <button id="d-restart">Restart game</button>
    <button id="d-copylink">Copy share link</button>
    <div id="d-stats"></div>
  </aside>
</div>

<div id="levelup" class="hidden">
  <div class="cards">
    <h2>Level up! Choose an upgrade</h2>
    <div class="cardrow">
      <button class="card" data-mult="1.10"><b>+10%</b><span>Fire rate</span></button>
      <button class="card" data-mult="1.25"><b>+25%</b><span>Fire rate</span></button>
      <button class="card" data-mult="1.50"><b>+50%</b><span>Fire rate</span></button>
    </div>
  </div>
</div>

<!-- bump ?v= on every game.js change: fresh URL busts the Pages/mobile cache -->
<script src="game.js?v=10"></script>
</body>
</html>
